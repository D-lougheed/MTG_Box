<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, initial-scale=1.0">
  <title>MTG Kiosk</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/lifecounter.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/horde.css">
</head>
<body>
  <main id="view-menu" class="view">
    <h1>MTG Kiosk</h1>
    <div class="tile-grid">
      <button class="tile" data-view="life-counter">Life Counter</button>
      <button class="tile" data-view="horde-mode">Horde Mode</button>
      <button class="tile" data-view="card-lookup">Card Lookup</button>
      <button class="tile" data-view="random-card">Random Card</button>
      <button class="tile" data-view="settings">Settings</button>
    </div>
  </main>

  <main id="view-life-counter" class="view hidden">
    <div id="life-counter-root"></div>
  </main>

  <main id="view-horde-mode" class="view hidden">
    <div id="horde-root"></div>
  </main>

  <main id="view-card-lookup" class="view hidden">
    <div id="card-lookup-root"></div>
  </main>

  <main id="view-random-card" class="view hidden">
    <div id="random-card-root"></div>
  </main>

  <!-- Settings is a menu of sections rather than one long scrolling page.
       Dragging a scrollbar on a 2-point resistive-feeling touchscreen is
       genuinely awkward, and every section below fits 480px without one. -->
  <main id="view-settings" class="view hidden">
    <h2>Settings</h2>
    <div class="tile-grid settings-menu">
      <button class="tile" data-view="settings-printer">
        Printer
        <span class="tile-note" id="printer-tile-note">checking…</span>
      </button>
      <button class="tile" data-view="settings-cards">
        Card database
        <span class="tile-note" id="cards-tile-note">checking…</span>
      </button>
      <button class="tile" data-view="wifi">
        Wifi
        <span class="tile-note" id="wifi-tile-note">checking…</span>
      </button>
      <button class="tile" data-view="settings-update">
        Software update
        <span class="tile-note" id="version-tile-note">checking…</span>
      </button>
      <button class="tile" data-view="settings-display">
        Display
        <span class="tile-note">Buttons and shortcuts</span>
      </button>
    </div>
    <button class="back-button" data-view="menu">Back</button>
  </main>

  <main id="view-settings-printer" class="view hidden">
    <h2>Printer</h2>
    <section class="status-row">
      <span>Status:</span>
      <span id="printer-status" class="badge badge-unknown">checking…</span>
    </section>

    <button id="selftest-button">Print self-test label</button>
    <p id="selftest-result"></p>

    <h3 class="settings-heading">What to print</h3>
    <div id="print-mode-options" class="option-row">
      <button class="option" data-print-mode="art">Art &amp; text</button>
      <button class="option" data-print-mode="image">Whole card</button>
      <button class="option" data-print-mode="text">Text only</button>
    </div>
    <p id="print-mode-note" class="option-note"></p>

    <button class="back-button" data-view="settings">Back</button>
  </main>

  <main id="view-settings-cards" class="view hidden">
    <h2>Card database</h2>
    <section class="status-row">
      <span>Cards:</span>
      <span id="cards-status">checking…</span>
    </section>
    <button id="cards-update-button">Download card database</button>
    <p id="cards-update-status"></p>

    <section class="status-row">
      <span>Card images:</span>
      <span id="images-status">checking…</span>
    </section>
    <button id="images-prefetch-button">Download all card images</button>
    <button id="images-stop-button" class="hidden">Stop</button>
    <p id="images-prefetch-status"></p>

    <button class="back-button" data-view="settings">Back</button>
  </main>

  <main id="view-settings-update" class="view hidden">
    <h2>Software update</h2>
    <section class="status-row">
      <span>Version:</span>
      <span id="version-status">checking…</span>
    </section>
    <section class="status-row">
      <span>Commit:</span>
      <span id="commit-status">checking…</span>
    </section>

    <button id="update-check-button">Check for updates</button>
    <p id="update-status"></p>
    <button id="update-apply-button" class="hidden">Install update &amp; restart</button>

    <button class="back-button" data-view="settings">Back</button>
  </main>

  <main id="view-settings-display" class="view hidden">
    <h2>Display</h2>
    <section class="status-row">
      <span>Wifi:</span>
      <span id="wifi-status">checking…</span>
    </section>

    <h3 class="settings-heading">Random card button</h3>
    <div class="option-row" id="random-button-options">
      <button class="option" data-random-button="on">Show</button>
      <button class="option" data-random-button="off">Hide</button>
    </div>
    <p id="random-button-note" class="option-note"></p>

    <button class="back-button" data-view="settings">Back</button>
  </main>

  <main id="view-wifi" class="view hidden">
    <div class="settings-scroll">
      <h2>Connect to Wifi</h2>
      <p id="wifi-scan-status"></p>
      <div id="wifi-network-list" class="wifi-network-list"></div>

      <button id="wifi-manual-button">Connect to a different network</button>

      <div id="wifi-connect-form" class="hidden">
        <p id="wifi-selected-ssid"></p>
        <div id="wifi-password-row" class="hidden">
          <input type="text" id="wifi-password-input" placeholder="Password">
          <button type="button" id="wifi-password-toggle">Hide</button>
        </div>
        <button id="wifi-connect-button">Connect</button>
        <button id="wifi-cancel-button">Cancel</button>
      </div>

      <div id="wifi-manual-form" class="hidden">
        <div id="wifi-manual-ssid-row">
          <input type="text" id="wifi-manual-ssid-input" placeholder="Network name">
        </div>
        <label class="wifi-secured-toggle">
          <input type="checkbox" id="wifi-manual-secured-checkbox">
          Secured network (needs a password)
        </label>
        <div id="wifi-manual-password-row" class="hidden">
          <input type="text" id="wifi-manual-password-input" placeholder="Password">
          <button type="button" id="wifi-manual-password-toggle">Hide</button>
        </div>
        <button id="wifi-manual-connect-button" disabled>Connect</button>
        <button id="wifi-manual-cancel-button">Cancel</button>
      </div>

      <p id="wifi-connect-status"></p>
    </div>

    <button class="back-button" data-view="settings">Back</button>
  </main>

  <!-- Inline SVG rather than the game-die emoji. That character lives in the
       supplementary plane and needs a colour-emoji font, which Raspberry Pi OS
       does not ship - on the device it rendered as an empty box. Drawing it
       removes the font dependency entirely and stays sharp at any size. -->
  <button id="random-card-fab" title="Random card" aria-label="Random card">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="3" y="3" width="18" height="18" rx="4" fill="none"
            stroke="currentColor" stroke-width="2"/>
      <circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/>
      <circle cx="15.5" cy="8.5" r="1.6" fill="currentColor"/>
      <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
      <circle cx="8.5" cy="15.5" r="1.6" fill="currentColor"/>
      <circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/>
    </svg>
  </button>

  <div id="onscreen-keyboard" class="keyboard hidden"></div>

  <script src="/js/keyboard.js"></script>
  <!-- app.js first: it owns the menu and showView(), so a feature script that
       throws on load can't take navigation down with it. -->
  <script src="/js/app.js"></script>
  <script src="/js/lifecounter.js"></script>
  <script src="/js/cards.js"></script>
  <script src="/js/horde.js"></script>
</body>
</html>
